<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sashreek Kumar - Blog</title>
    <link rel="stylesheet" href="../css/card.css" />
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Lora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/logo.svg">

    <style>
        /* Use the Lora font family */
        body {
            font-family: 'Lora', serif;
        }
        /* Custom class for a subtle background pattern */
        .bg-pattern {
            background-color: #f8fafc; /* gray-50 */
        }
        
        /* Smooth transitions for content sections */
        .content-section {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            display: none;
        }
        
        .content-section.active {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }
        
        /* Active tab styling */
        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
            padding: 6px 16px;
            border-radius: 20px;
            background-color: transparent;
            border: 1px solid transparent;
        }
        
        @media (min-width: 768px) {
            .tab-btn {
                padding: 8px 20px;
            }
        }
        
        .tab-btn.active {
            color: #387ed1;
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }
        
        .tab-btn:hover:not(.active) {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header & Navigation -->
    <header id="header" class="bg-white/80 backdrop-blur-md w-full z-50 pt-4 sticky top-0">
        <!-- The container div is constrained on large screens -->
        <div class="w-full lg:w-[55%] mx-auto px-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200">
                <a href="../index.html" class="text-[24px] text-slate-900">Sashreek Kumar</a>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">About</a>
                    <a href="#" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">Blog</a>
                    <a href="paper_implementations.html" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">Paper Implementations</a>
                    <a href="projects.html" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">Projects</a>
                </nav>
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-button" class="md:hidden text-slate-800 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
             <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden mt-4 bg-white rounded-lg shadow-md">
                <a href="../index.html" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100 rounded-t-lg">About</a>
                <a href="#" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100">Blog</a>
                <a href="paper_implementations.html" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100">Paper Implementations</a>
                <a href="projects.html" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100 rounded-b-lg">Projects</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full lg:w-[55%] mx-auto">
        <!-- Sub-navigation Tabs -->
        <section class="bg-white border-b border-slate-200">
            <div class="px-6 pt-8 pb-4">
                <div class="flex justify-center space-x-3 md:space-x-4 overflow-x-auto">
                    <button class="tab-btn active text-sm md:text-base pb-2 whitespace-nowrap" data-tab="technical">
                        Technical
                    </button>
                    <button class="tab-btn text-sm md:text-base pb-2 whitespace-nowrap text-slate-600" data-tab="reading">
                        Reading
                    </button>
                    <button class="tab-btn text-sm md:text-base pb-2 whitespace-nowrap text-slate-600" data-tab="non-technical">
                        Non-Tech
                    </button>
                </div>
            </div>
        </section>

        <!-- Content Sections -->
        <section class="bg-pattern pt-12 pb-16">
            <div class="px-6">
                <!-- Technical Section -->
                <div id="technical" class="content-section active">
                    <h2 class="text-2xl text-slate-900 mb-4">Technical</h2>
                    <div class="text-slate-700 text-base leading-relaxed space-y-2">
                        <p>1. COMING SOON</p>
                        <p>2. COMING SOON</p>
                        <p>3. COMING SOON</p>
                    </div>
                </div>

                <!-- Reading Section -->
                <div id="reading" class="content-section">
                    <h2 class="text-2xl text-slate-900 mb-4">Reading</h2>
                    <div class="text-slate-700 text-base leading-relaxed space-y-2">
                        <p>1. COMING SOON</p>
                        <p>2. COMING SOON</p>
                        <p>3. COMING SOON</p>
                    </div>
                </div>

                <!-- Non-Tech Section -->
                <div id="non-technical" class="content-section">
                    <h2 class="text-2xl text-slate-900 mb-4">Non-Tech</h2>
                    <div class="text-slate-700 text-base leading-relaxed space-y-2">
                        <p>1. COMING SOON</p>
                        <p>2. COMING SOON</p>
                        <p>3. COMING SOON</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuButton.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileMenu.classList.toggle('hidden');
        });

        const mobileNavLinks = document.querySelectorAll('#mobile-menu a');
        mobileNavLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });
        
        document.addEventListener('click', (event) => {
            const isClickInsideMenu = mobileMenu.contains(event.target);
            const isClickOnButton = mobileMenuButton.contains(event.target);
            if (!isClickInsideMenu && !isClickOnButton) {
                mobileMenu.classList.add('hidden');
            }
        });

        // Tab switching functionality
        const tabButtons = document.querySelectorAll('.tab-btn');
        const contentSections = document.querySelectorAll('.content-section');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.getAttribute('data-tab');
                
                // Remove active class from all buttons
                tabButtons.forEach(btn => {
                    btn.classList.remove('active');
                    btn.classList.add('text-slate-600');
                });
                
                // Add active class to clicked button
                button.classList.add('active');
                button.classList.remove('text-slate-600');
                
                // Hide all content sections
                contentSections.forEach(section => {
                    section.classList.remove('active');
                });
                
                // Show target content section with a small delay for smooth transition
                setTimeout(() => {
                    document.getElementById(targetTab).classList.add('active');
                }, 50);
            });
        });
    </script>

</body>
</html>
