<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Lora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Use the Lora font family */
        body {
            font-family: 'Lora', serif;
        }
        /* Custom class for a subtle background pattern */
        .bg-pattern {
            background-color: #f8fafc; /* gray-50 */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header & Navigation -->
    <header id="header" class="bg-white/80 backdrop-blur-md w-full z-50 pt-4 sticky top-0">
        <!-- The container div is constrained on large screens -->
        <div class="w-full lg:w-[55%] mx-auto px-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200">
                <a href="#home" class="text-[24px] text-slate-900">Sashreek Kumar</a>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">About</a>
                    <a href="blog.html" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">Blog</a>
                    <a href="#" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[18px]">Paper Implementations</a>
                    <a href="projects.html" class="text-slate-600 hover:text-[#387ed1] transition duration-100 text-[16px]">Projects</a>
                </nav>
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-button" class="md:hidden text-slate-800 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
             <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden mt-4 bg-white rounded-lg shadow-md">
                <a href="../index.html" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100 rounded-t-lg">About</a>
                <a href="blog.html" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100">Blog</a>
                <a href="#" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100">Paper Implementations</a>
                <a href="projects.html" class="block py-2 px-4 text-sm text-slate-600 hover:bg-slate-100 rounded-b-lg">Projects</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full lg:w-[55%] mx-auto">
        <!-- About Section -->
        <section id="about" class="bg-pattern pt-16 md:pt-16 pb-4">
            <div class="px-6">
                <div class="text-slate-700 text-base leading-relaxed">
                    TEXT GOES HERE
                </div>
            </div>
        </section>
    </main>

    <script>
        // JavaScript for the mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuButton.addEventListener('click', (e) => {
            e.stopPropagation(); // prevent the document click from firing immediately
            mobileMenu.classList.toggle('hidden');
        });

        // Close mobile menu when a link is clicked
        const mobileNavLinks = document.querySelectorAll('#mobile-menu a');
        mobileNavLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });
        
        // Close mobile menu when clicking outside of it
        document.addEventListener('click', (event) => {
            const isClickInsideMenu = mobileMenu.contains(event.target);
            const isClickOnButton = mobileMenuButton.contains(event.target);
            if (!isClickInsideMenu && !isClickOnButton) {
                mobileMenu.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
